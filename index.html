*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  const name = g.g;
  return `<section class="nfrow" style="--ri:${ri || 0}"><div class="nfrow-h"><h3>${esc(name)}<small class="nfcnt">${g.v.length}</small></h3></div>
  <div class="nfsc-wrap"><button type="button" class="nfarr nfarr-l" data-nfarr="-1" aria-label="${T('Zurück')}">${svg('prev')}</button><div class="nfsc">${g.v.map(([t, id, vid], i) => `<button type="button" class="nfc nfv${sec === 'hg' ? ' po9' : ''}" data-soon data-t="${esc(fxNorm(t))}" aria-label="${esc(t)} – ${T('Bald verfügbar')}" style="--i:${Math.min(i, 8)};--r:${(i % 3 - 1) * 1.4}deg"><span class="nfv-fb nofb"><b>${String(i + 1).padStart(2, '0')}</b></span><img src="${thumbSrc(id)}" alt="" decoding="async" onload="this.classList.add('ok')"><span class="nfc-g"></span><span class="nfsoon2">${T('Bald verfügbar')}</span><span class="nfc-p">${svg('play')}</span><span class="nfc-t"><b>${esc(t)}</b><small>${esc(name)}</small></span></button>`).join('')}</div><button type="button" class="nfarr nfarr-r" data-nfarr="1" aria-label="${T('Weiter')}">${svg('next')}</button></div></section>`
}

/* ---------- Pfeile für die Reihen (Desktop) ---------- */
function updNfArr(wrap) { const sc = wrap.querySelector('.nfsc'); if (!sc) return; const max = Math.max(0, sc.scrollWidth - sc.clientWidth); const sl = sc.scrollLeft; const eps = 8; const l = wrap.querySelector('.nfarr-l'), r = wrap.querySelector('.nfarr-r'); if (l) l.disabled = sl <= eps; if (r) r.disabled = sl >= max - eps; wrap.classList.toggle('no-scroll', max <= eps) }
function initNfArr(root) {
  (root || document).querySelectorAll('.nfsc-wrap').forEach(wrap => {
    if (wrap.dataset.nfarrOn) { updNfArr(wrap); return } wrap.dataset.nfarrOn = 1; const sc = wrap.querySelector('.nfsc'); if (!sc) return;
    wrap.addEventListener('click', e => { const b = e.target.closest('[data-nfarr]'); if (!b || !wrap.contains(b)) return; e.preventDefault(); e.stopPropagation(); const step = Math.max(sc.clientWidth * .9, 120); sc.scrollBy({ left: (+b.dataset.nfarr) * step, behavior: 'smooth' }) });
    sc.addEventListener('scroll', () => updNfArr(wrap), { passive: true });
    if (window.ResizeObserver) { const ro = new ResizeObserver(() => updNfArr(wrap)); ro.observe(sc); ro.observe(wrap) } updNfArr(wrap)
  })
}

/* ---------- Album-Fächer: Cover fliegt in den Album-Kopf und zurück ---------- */
const fdRM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function fdBox(el) { const r = el.getBoundingClientRect(), w = el.offsetWidth; return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, w } }
function fdFly(src, a, rotFrom, b, rotTo, hide) {
  if (!a.w || !b.w || fdRM()) return;
  const c = document.createElement('img'); c.src = src; c.className = 'fxfly'; c.alt = '';
  Object.assign(c.style, { width: a.w + 'px', height: a.w + 'px', left: (a.cx - a.w / 2) + 'px', top: (a.cy - a.w / 2) + 'px' }); document.body.appendChild(c);
  hide.style.visibility = 'hidden'; const dx = b.cx - a.cx, dy = b.cy - a.cy; let done = false;
  const end = () => { if (done) return; done = true; hide.style.visibility = ''; c.remove() };
  const an = c.animate([{ transform: `translate(0,0) rotate(${rotFrom}deg) scale(1)` }, { transform: `translate(${dx}px,${dy}px) rotate(${rotTo}deg) scale(${b.w / a.w})` }], { duration: 620, easing: 'cubic-bezier(.2,.85,.25,1)', fill: 'forwards' });
  an.onfinish = end; an.oncancel = end; setTimeout(end, 1200)
}
function fdMainTop() { const m = document.getElementById('fdmain'), hd = document.querySelector('.fdhead'); if (!m) return 0; return Math.max(0, m.getBoundingClientRect().top + window.scrollY - (hd ? hd.offsetHeight : 0) - 6) }
const fdRot = el => parseFloat(getComputedStyle(el).getPropertyValue('--r')) || 0;
function fdEager(sec) { sec.querySelectorAll('.nfv img').forEach(im => { if (im.complete && im.naturalWidth) im.classList.add('ok'); else { im.loading = 'eager'; im.addEventListener('load', () => im.classList.add('ok'), { once: true }) } }) }
function openAlbum(k, fromPop) {
  const v = document.querySelector('.fdv'); if (!v || v.dataset.alb === k) return;
  const alb = v.querySelector(`.fxalb[data-album="${k}"]`), card = alb && alb.querySelector('.fxalb-s');
  const from = card && card.offsetParent ? fdBox(card) : null, rot = alb ? fdRot(alb) : 0, src = card ? card.querySelector('img').src : '';
  fb('open', 10); S.fdAlb = k; if (!fromPop) { try { history.pushState({ ...(history.state || {}), alb: k }, '', location.href) } catch (_) {} }
  v.dataset.alb = k; const sec = v.querySelector(`.fxsec[data-sec="${k}"]`); sec.classList.remove('alb-in'); void sec.offsetWidth; sec.classList.add('alb-in');
  window.scrollTo({ top: fdMainTop(), behavior: 'instant' }); fdEager(sec); sec.querySelectorAll('.nfsc-wrap').forEach(updNfArr);
  const tgt = sec.querySelector('.fxah-c'); if (from && tgt) fdFly(src, from, rot, fdBox(tgt), 0, tgt)
}
function closeAlbum(fromPop) {
  const v = document.querySelector('.fdv'); if (!v || !v.dataset.alb) return; const k = v.dataset.alb;
  const hc = v.querySelector(`.fxsec[data-sec="${k}"] .fxah-c`); const from = hc && hc.offsetParent ? fdBox(hc) : null;
  S.fdAlb = ''; v.dataset.alb = ''; const fan = v.querySelector('.fxfan'); fan.classList.remove('intro', 'ret'); void fan.offsetWidth; fan.classList.add('ret');
  window.scrollTo({ top: fdMainTop(), behavior: 'instant' }); if (!fromPop && history.state && history.state.alb) { try { history.back() } catch (_) {} }
  const alb = v.querySelector(`.fxalb[data-album="${k}"]`), card = alb && alb.querySelector('.fxalb-s');
  if (from && card) fdFly(hc.src, from, 0, fdBox(card), fdRot(alb), card)
}
window.addEventListener('popstate', () => { const st = history.state || {}; const v = document.querySelector('.fdv'); if (v) { const want = st.alb || ''; if ((v.dataset.alb || '') !== want) { want ? openAlbum(want, true) : closeAlbum(true) } } });

/* ---------- Seite ---------- */
function igCard() { return `<a class="igcard2" href="https://www.instagram.com/edeka_foodacademy/" ${NFX}><span class="igav"><img src="fresh/fa-insta.webp" alt="EDEKA Food Academy"></span><span class="igtx2"><span class="ign">edeka_foodacademy ${svg('insta', 'igmini')}</span><small>${T('Live dabei: Seminare, Tricks & Fresh-Momente')}</small></span><span class="igfollow">${T('Folgen')}</span></a>` }
function vFreshDigital() {
  const alb = (history.state && history.state.alb) || ''; S.fdAlb = alb; const A = fdAlbums();
  return `<div class="view fdv" data-alb="${alb}">
   <header class="bar fdhead"><a class="fdh-logo" href="./" aria-label="${T('EDEKA Food Academy Fresh – zur Startseite')}"><img src="img/logo-fa-fresh.png" width="1151" height="537" alt="EDEKA Food Academy Fresh"></a><div class="ttl">Fresh Digital</div></header>
   <h1 class="sr-only">Fresh Digital</h1>
   <section class="fdhero" aria-label="Fresh Digital">
    <span class="fdhero-glow" aria-hidden="true"></span>
    <div class="fdhero-par"><div class="fdhero-in"><div class="fdhero-logo"><img src="fresh/fd-logo.webp" width="1100" height="369" alt="Fresh Digital"><span class="fd-new2 fdhero-new">${T('Neu!')}</span></div>
     <p class="fdhero-sub">${T('100 Handgriffe & Legetechniken')}<span>${T('Kurz, direkt aus der Praxis – für die Bedientheke.')}</span></p></div></div>
    <button type="button" class="fdhero-down" data-down>${T('Zu den Videos')}<i>${svg('chev')}</i></button>
   </section>
   <div id="fdmain"></div>
   <div class="fxsearch">${svg('search')}<input id="fxq" type="search" placeholder="${T('Videos durchsuchen …')}" aria-label="${T('Videos durchsuchen …')}" autocomplete="off"><span id="fxcnt"></span><button class="fxclr" type="button" hidden aria-label="${T('Suche leeren')}">${svg('x')}</button></div>
   <div class="fxfan${alb ? '' : ' intro'}"><div class="fxfan-in">${['hg', 'lege'].map((k, i) => `<button class="fxalb" data-album="${k}" style="--r:${i ? 8 : -8}deg;--k:${i}" aria-label="${esc(A[k].t)}"><span class="fxalb-d"><i></i></span><span class="fxalb-s"><img src="${A[k].img}" alt="" draggable="false"></span><span class="fxalb-t"><b>${esc(A[k].t)}</b><small>${T('{0} Videos', A[k].n)}</small></span></button>`).join('')}</div><p class="fxfan-h">${T('Album antippen zum Öffnen')}</p></div>
   <div class="fxsec" data-sec="hg">${fdAlbHead(A.hg)}
   ${FD.hg.map((g, i) => fdRow(g, 'hg', i)).join('')}</div>
   <div class="fxsec" data-sec="lege">${fdAlbHead(A.lege)}
   ${FD.lege.map((g, i) => fdRow(g, 'lege', i)).join('')}</div>
   <p class="fxnone" hidden>${T('Keine Videos gefunden')}</p>
   <div class="nfrow-h nfmore"><h3>${T('Mehr von der Food Academy')}</h3></div>
   <div class="fdlist" style="padding-top:4px">
    <a class="nxcard" href="https://www.next.edeka/nst_" ${NFX}><img class="nxlogo" src="fresh/next-logo.webp" alt="EDEKA next"><span class="nxtx"><small>${T('Blended Learning')}</small><b>${T('Wissen, das zu dir passt.')}</b><span class="nxs">${T('Unsere Seminare enden nicht nach dem letzten Seminartag: Auf EDEKA next bekommst du passende Lerninhalte, Videos und Unterlagen direkt vor und nach deinem Seminar – zum Vertiefen, Wiederholen und sofort im Markt Anwenden.')}</span><span class="nxtags"><em>${T('Einfach.')}</em><em>${T('Flexibel.')}</em><em>${T('Direkt verfügbar.')}</em></span><span class="nxgo">${svg('ext')}${T('Zu EDEKA next')}</span><span class="nxid">${svg('shield')}${T('Zugang mit EDEKA-ID & Passwort')}</span></span></a>
    <a class="wzcard" href="https://wizzup.quizzer-server.de/" ${NFX}><span class="wzlogo">Wizz<br>Up!</span><span class="wztx"><b>${T('Lernen, spielen, Wissen pushen!')}</b><small>${T('WizzUp! macht Lernen zum Quiz-Duell – im Browser oder per App. Mit deinem next-Zugang startest du sofort.')}</small><span class="wzgo">${svg('trophy')}${T('Zur Challenge')}</span></span></a>
    ${igCard()}
    <a class="lnk glass" href="${FINDER}#katalog-fresh" ${NFX} style="margin:0;width:100%"><span class="pi">${svg('book')}</span><span><b>${T('Fresh-Broschüre 2027')}</b><span class="s">${T('Im Seminar-Finder der Food Academy')}</span></span>${svg('chev', 'arr')}</a>
   </div>
   <footer class="fdfoot">EDEKA Food Academy Fresh · Nordbayern · Sachsen · Thüringen<br><a href="${FINDER}" ${NFX}>${T('Zum Seminar-Finder 2027')}</a></footer>
   <div style="height:calc(24px + var(--safe-b))"></div></div>`
}

function initFx(v) {
  initNfArr(v);
  const fan = v.querySelector('.fxfan.intro'); if (fan) setTimeout(() => fan.classList.remove('intro'), 1800);
  if (v.dataset.alb) { const sec = v.querySelector(`.fxsec[data-sec="${v.dataset.alb}"]`); if (sec) fdEager(sec) }
  v.querySelectorAll('.nfv img').forEach(im => { const ok = () => im.classList.add('ok'); if (im.complete && im.naturalWidth) ok(); else im.addEventListener('load', ok, { once: true }) });
  const q = v.querySelector('#fxq'); const cnt = v.querySelector('#fxcnt'), none = v.querySelector('.fxnone'), clr = v.querySelector('.fxclr');
  const run = () => {
    const s = fxNorm(q.value.trim()); v.classList.toggle('fxs', !!s); clr.hidden = !s; let n = 0;
    v.querySelectorAll('.fxsec .nfrow').forEach(r => { let k = 0; const cs = r.querySelectorAll('.nfv'); cs.forEach(c => { const m = !s || c.dataset.t.includes(s); c.hidden = !m; if (m) k++ }); r.hidden = !!s && !k; const b = r.querySelector('.nfcnt'); if (b) b.textContent = s ? k : cs.length; n += k });
    cnt.textContent = s ? T('{0} Videos', n) : ''; none.hidden = !s || n > 0; v.querySelectorAll('.nfsc-wrap').forEach(updNfArr)
  };
  q.addEventListener('input', run); clr.addEventListener('click', () => { q.value = ''; run(); q.focus() })
}

function heroScroll() {
  const h = document.querySelector('.fdhero'); if (!h) return; const H = h.offsetHeight || 1; const y = Math.min(Math.max(window.scrollY, 0), H); const p = y / H;
  h.style.setProperty('--py', (y * .42).toFixed(1) + 'px'); h.style.setProperty('--ps', (1 - p * .16).toFixed(4)); h.style.setProperty('--po', Math.max(0, 1 - p * 1.25).toFixed(3))
}
let heroRaf = 0;
window.addEventListener('scroll', () => { if (fdRM() || heroRaf) return; heroRaf = requestAnimationFrame(() => { heroRaf = 0; heroScroll() }) }, { passive: true });
function render() { app.innerHTML = vFreshDigital(); const v = app.querySelector('.fdv'); initFx(v); heroScroll(); if (v.dataset.alb) requestAnimationFrame(() => window.scrollTo({ top: fdMainTop(), behavior: 'instant' })) }

app.addEventListener('click', e => {
  const ab = e.target.closest('[data-album]'); if (ab) { openAlbum(ab.dataset.album); return }
  if (e.target.closest('[data-albx]')) { fb('sel', 8); closeAlbum(); return }
  if (e.target.closest('[data-soon]')) { fb('sel', 8); toast(T('Video folgt in Kürze')); return }
  if (e.target.closest('[data-down],.fdhero-logo')) { fb('sel', 6); window.scrollTo({ top: fdMainTop(), behavior: fdRM() ? 'auto' : 'smooth' }); return }
});

try { history.scrollRestoration = 'manual' } catch (_) {}  /* Zurück-Taste: Seite steuert die Scrollposition selbst (bleibt in der Netflix-Ansicht) */
document.documentElement.style.setProperty('--acc', '#FF8A1F');
buildBgRows();
render();

/* PWA: Service Worker für Home-Bildschirm & Offline */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}) }) }

</script>
